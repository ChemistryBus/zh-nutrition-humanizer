<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="24" y="38" font-size="18" font-weight="700" fill="#1f2328">zh-nutrition-humanizer</text>
  <text x="24" y="62" font-size="13" fill="#57606a">Draft in, mechanical check, human judgement out. Expression changes; facts do not.</text>

  <rect x="24" y="96" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="99" y="124" font-size="14" text-anchor="middle" fill="#1f2328">Chinese draft</text>
  <text x="99" y="144" font-size="11" text-anchor="middle" fill="#57606a">manuscript / article</text>

  <rect x="230" y="96" width="190" height="64" rx="8" fill="#eef6ff" stroke="#a5c9f5"/>
  <text x="325" y="124" font-size="14" text-anchor="middle" fill="#1f2328">check.py</text>
  <text x="325" y="144" font-size="11" text-anchor="middle" fill="#57606a">12 counted rules + 3 style checks</text>

  <rect x="476" y="96" width="150" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="551" y="124" font-size="14" text-anchor="middle" fill="#1f2328">Human review</text>
  <text x="551" y="144" font-size="11" text-anchor="middle" fill="#57606a">edit / keep / add</text>

  <rect x="682" y="96" width="120" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="742" y="124" font-size="14" text-anchor="middle" fill="#1f2328">Rewrite</text>
  <text x="742" y="144" font-size="11" text-anchor="middle" fill="#57606a">L→T→C→S</text>

  <rect x="858" y="96" width="84" height="64" rx="8" fill="#eaf7ee" stroke="#9fd6ae"/>
  <text x="900" y="124" font-size="14" text-anchor="middle" fill="#1f2328">Re-check</text>
  <text x="900" y="144" font-size="11" text-anchor="middle" fill="#57606a">numbers intact</text>

  <line x1="174" y1="128" x2="226" y2="128" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="420" y1="128" x2="472" y2="128" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="626" y1="128" x2="678" y2="128" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="802" y1="128" x2="854" y2="128" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8c959f"/></marker></defs>

  <rect x="24" y="196" width="440" height="72" rx="8" fill="#fff8e6" stroke="#e6cc80"/>
  <text x="40" y="220" font-size="13" font-weight="600" fill="#1f2328">Corpus baseline</text>
  <text x="40" y="240" font-size="11" fill="#57606a">141 excerpts / 53k characters, eight statistics, recomputable</text>
  <text x="40" y="258" font-size="11" fill="#57606a">Textbooks, dietary guidelines, DRIs, 11 national guidance documents</text>

  <rect x="496" y="196" width="446" height="72" rx="8" fill="#fdeff0" stroke="#e8a9b0"/>
  <text x="512" y="220" font-size="13" font-weight="600" fill="#1f2328">Evaluation</text>
  <text x="512" y="240" font-size="11" fill="#57606a">50 held-out vs 50 LLM paragraphs: 74.5× density, 4.0% false positives</text>
  <text x="512" y="258" font-size="11" fill="#57606a">Threshold sweep 1–8; knee at 1–2; default 3</text>
</svg>
