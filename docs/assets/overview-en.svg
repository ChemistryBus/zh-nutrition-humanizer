<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="'Helvetica Neue',Arial,'Noto Sans',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <style>
      .t  { font-size: 13px; fill: #1f2328; }
      .s  { font-size: 11.5px; fill: #57606a; }
      .h  { font-size: 13.5px; font-weight: 700; fill: #1f2328; }
      .n  { font-size: 11px; fill: #6e7781; }
    </style>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1f2328">zh-nutrition-humanizer</text>
  <text x="40" y="72" class="s" font-size="13">Quality control for Chinese nutrition writing: match the voice Chinese nutrition institutions publish in</text>

  <text x="40" y="112" class="h">1. Three bodies of text to align with</text>

  <rect x="40" y="126" width="296" height="126" r="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="58" y="150" class="h">National nutrition policy</text>
  <text x="58" y="172" class="s">National Nutrition Plan (2017–2030)</text>
  <text x="58" y="191" class="s">Healthy China Action; NHC guidance series</text>
  <text x="58" y="210" class="s">Governs 应 / 宜 / 建议 usage</text>
  <text x="58" y="233" class="n">Voice: addressed to a population, not a reader</text>

  <rect x="352" y="126" width="296" height="126" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="370" y="150" class="h">Chinese Nutrition Society books</text>
  <text x="370" y="172" class="s">Encyclopedia of Nutrition Science (2e)</text>
  <text x="370" y="191" class="s">Dietary Guidelines for Chinese Residents</text>
  <text x="370" y="210" class="s">DRIs (2023)</text>
  <text x="370" y="233" class="n">Voice: definition first, mechanism after</text>

  <rect x="664" y="126" width="296" height="126" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="682" y="150" class="h">National, industry, local standards</text>
  <text x="682" y="172" class="s">GB 24154, GB 28050, GB 7718</text>
  <text x="682" y="191" class="s">WS/T series; GB/T 21922 terminology</text>
  <text x="682" y="210" class="s">Local dietary-guidance specifications</text>
  <text x="682" y="233" class="n">Voice: quantities and terms without restatement</text>

  <line x1="500" y1="256" x2="500" y2="286" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="292" width="920" height="62" rx="10" fill="#fff8e6" stroke="#e6cc80"/>
  <text x="60" y="318" class="h">2. Corpus baseline: 141 excerpts, 53,000 characters, each with source and page</text>
  <text x="60" y="340" class="s">Eight statistics: sentence length, connectives, sentences per paragraph, first person, numbers and units, terminology, evidence position, paragraph openings</text>

  <line x1="500" y1="358" x2="500" y2="386" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="40" y="408" class="h">3. Path of one draft</text>
  <rect x="40" y="420" width="164" height="58" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="122" y="444" class="t" text-anchor="middle">Draft</text>
  <text x="122" y="463" class="n" text-anchor="middle">manuscript / article</text>

  <rect x="232" y="420" width="184" height="58" rx="10" fill="#eef6ff" stroke="#a5c9f5"/>
  <text x="324" y="444" class="t" text-anchor="middle">check.py</text>
  <text x="324" y="463" class="n" text-anchor="middle">12 rules + 3 style checks</text>

  <rect x="444" y="420" width="164" height="58" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="526" y="444" class="t" text-anchor="middle">Human review</text>
  <text x="526" y="463" class="n" text-anchor="middle">edit / keep / add</text>

  <rect x="636" y="420" width="150" height="58" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="711" y="444" class="t" text-anchor="middle">Rewrite</text>
  <text x="711" y="463" class="n" text-anchor="middle">L→T→C→S</text>

  <rect x="814" y="420" width="146" height="58" rx="10" fill="#eaf7ee" stroke="#9fd6ae"/>
  <text x="887" y="444" class="t" text-anchor="middle">Re-check</text>
  <text x="887" y="463" class="n" text-anchor="middle">numbers intact</text>

  <line x1="204" y1="449" x2="228" y2="449" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="416" y1="449" x2="440" y2="449" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="608" y1="449" x2="632" y2="449" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="786" y1="449" x2="810" y2="449" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="498" width="452" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="522" class="h">4. Evaluation: 50 held-out vs 50 LLM drafts</text>
  <text x="58" y="546" class="t">Density ratio <tspan font-weight="700">74.5×</tspan>　false positives <tspan font-weight="700">4.0%</tspan></text>
  <text x="58" y="568" class="s">Paragraph recall 92% (textbook 88% / popular 96%)</text>
  <text x="58" y="586" class="n">Threshold sweep 1–8; knee 1–2; default 3</text>

  <rect x="508" y="498" width="452" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="526" y="522" class="h">5. Blind rating: 20 pairs, A/B randomised</text>
  <text x="526" y="546" class="t">Popular <tspan font-weight="700">20 wins, 0 losses</tspan> (4.25 vs 2.45)</text>
  <text x="526" y="568" class="t">Textbook <tspan font-weight="700">16 ties</tspan> (4.90 vs 4.90)</text>
  <text x="526" y="586" class="n">Textbook drafts can only be fixed at the style level</text>

  <text x="40" y="614" class="n">Expression changes; facts do not: numbers, units and evidence grades stay untouched.</text>
</svg>
