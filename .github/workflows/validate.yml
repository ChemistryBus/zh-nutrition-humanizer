name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile scripts
        run: python -m py_compile scripts/check.py scripts/eval.py scripts/stats.py scripts/features.py scripts/validate.py scripts/polish.py scripts/doctor.py scripts/audit.py scripts/source_db.py scripts/eval_revisions.py scripts/fidelity.py
      - name: Repository self-check
        run: python scripts/validate.py
      - name: Install contract (no harness probes)
        run: python scripts/doctor.py --ci
      - name: Shell syntax
        run: bash -n bootstrap.sh
      - name: Profile and diff modes run
        run: |
          python scripts/check.py examples/before.md --profile textbook > /dev/null || true
          python scripts/check.py examples/before.md --diff > /dev/null || true
      - name: Checker flags the raw drafts
        run: |
          set +e
          python scripts/check.py examples/before.md --threshold 3
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1 for raw drafts, got $code"; exit 1; fi
