name: 新规则建议
description: 提出一条新规则，并附语料证据（没有证据的规则进不来）
title: "[规则] "
labels: ["new-rule"]
body:
  - type: markdown
    attributes:
      value: |
        本仓库的规矩：**每条规则都要有语料依据**。
        没有「机构文本 X 处／千字 vs 大模型文本 Y 处／千字」这组数字，规则只能进讨论，不进规则表。
  - type: input
    id: pattern
    attributes:
      label: 候选正则
      placeholder: '其机制在于|其依据在于|机制上，'
    validations:
      required: true
  - type: input
    id: gold
    attributes:
      label: 权威语料里的频率
      description: 用 `python3 scripts/features.py --gold references/corpus --neg eval/neg` 可复算
      placeholder: "0.03 处/千字（1% 段落）"
    validations:
      required: true
  - type: input
    id: neg
    attributes:
      label: 大模型语料里的频率
      placeholder: "1.07 处/千字（35% 段落）"
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: 改法
      description: 一句话，可执行
      placeholder: "删空转句，直接写机制；一句一个论断"
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 改前改后各两例
      description: 真实稿子，不要现编
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我在完整语料上跑过，段落级误报率没有升高
          required: true
        - label: 这条规则不会改动事实、数字或证据等级
          required: true
